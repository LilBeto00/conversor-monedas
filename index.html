<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Seguridad: solo se permite cargar código y datos de estos orígenes (ver docs/seguridad.md) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https://flagcdn.com; connect-src 'self' https://open.er-api.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="no-referrer">
  <title>Conversor de monedas</title>
  <meta name="description" content="Convierte yenes, euros, dólares y cualquier otra moneda con tipos de cambio actualizados.">
  <meta name="theme-color" content="#0b1020">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Conversor">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="glow glow-a" aria-hidden="true"></div>
  <div class="glow glow-b" aria-hidden="true"></div>

  <main class="app">
    <header class="top">
      <div>
        <p class="eyebrow">Tipos de cambio</p>
        <h1>Conversor</h1>
      </div>
      <button id="refresh" class="icon-btn" aria-label="Actualizar tipos de cambio" title="Actualizar">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
    </header>

    <section class="hero">
      <label for="amount" class="hero-label">Tengo</label>
      <div class="hero-row">
        <input id="amount" type="text" inputmode="decimal" autocomplete="off" maxlength="20" value="1000" aria-label="Cantidad">
        <button id="from" class="currency-btn" aria-label="Cambiar moneda de origen"></button>
      </div>
      <p id="from-name" class="hero-sub"></p>
    </section>

    <div class="section-head">
      <h2>Equivale a</h2>
      <button id="add" class="chip">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Añadir moneda
      </button>
    </div>

    <ul id="results" class="results" aria-live="polite"></ul>

    <p id="status" class="status">Cargando tipos de cambio…</p>
    <p class="credit"><a href="https://www.exchangerate-api.com" target="_blank" rel="noopener noreferrer">Rates By Exchange Rate API</a></p>
  </main>

  <dialog id="picker" class="picker" aria-labelledby="picker-title">
    <div class="sheet">
      <div class="sheet-head">
        <h2 id="picker-title">Elige moneda</h2>
        <button id="picker-close" class="icon-btn small" aria-label="Cerrar">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="search">
        <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="search" type="search" maxlength="40" placeholder="Buscar: libra, GBP, peso…" autocomplete="off" aria-label="Buscar moneda">
      </div>
      <ul id="picker-list" class="picker-list"></ul>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
